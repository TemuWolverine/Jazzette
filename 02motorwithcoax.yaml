substitutions:
  media_sample_rate: 48000
  friendly_name: Jazzette
  device_name: jazzette

  btna_pin: GPIO07
  btnb_pin: GPIO08
  btnc_pin: GPIO09
  btnd_pin: GPIO10

  mtr_a: GPIO41
  mtr_b: GPIO42
  mtr_slp: GPIO45
 
  coax_din: GPIO21
  toslink_din: GPIO40
  

packages:
  esphome_templates:
    url: https://github.com/TemuWolverine/esphome_templates
    ref: main
    refresh: 1s
    files:
      - esphome_boilerplate.yaml
      - boards/esp32_s3_nano.yaml
        
# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  manual_ip:
    static_ip: 10.0.1.138
    gateway: 10.0.0.1
    subnet: 255.0.0.0


output:
  - platform: ledc
    id: motor_enable
    pin: ${mtr_slp}
    
  - platform: ledc
    id: motor_forward_pin
    pin: ${mtr_a}
    
  - platform: ledc
    id: motor_reverse_pin
    pin: ${mtr_b}
 
fan:
  - platform: hbridge
    id: mtr_tape
    name: "Tape Motor"
    pin_a: motor_forward_pin 
    pin_b: motor_reverse_pin
    enable_pin: motor_enable
    decay_mode: slow

binary_sensor:
  - platform: gpio
    id: button_a
    name: "Button A"
    pin:
      number: ${btna_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_click:
          then:
            - fan.turn_on:
                id: mtr_tape
                direction: FORWARD
                speed: 100

  - platform: gpio
    id: button_b
    name: "Button B"
    pin:
      number: ${btnb_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_click:
          then:
            - fan.turn_on:
                id: mtr_tape
                direction: REVERSE
                speed: 1000

  - platform: gpio
    id: button_c
    name: "Button C"
    pin:
      number: ${btnc_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_click:
      then:
        - fan.turn_off:
            id: mtr_tape


# Sendspin audio hub
sendspin:

i2s_audio:
  - id: i2s_spdif
    
# Speaker outputs
speaker:
  - platform: i2s_audio
    id: speaker_spdif
    dac_type: external
    i2s_audio_id: i2s_spdif
    i2s_dout_pin: ${coax_din}
    spdif_mode: true
    sample_rate: ${media_sample_rate}
    channel: stereo
    use_apll: true
    i2s_mode: primary
    i2s_comm_fmt: stand_i2s
    mclk_multiple: 256

# Media source from SendSpin
media_source:
  - platform: sendspin
    id: sendspin_source

# Media players
media_player:
  - platform: speaker_source
    id: sendspin_media_player
    name: "SendSpin Media Player"
    media_pipeline:
      format: FLAC
      sample_rate: ${media_sample_rate}
      num_channels: 2
      speaker: speaker_spdif
      sources:
        - sendspin_source
    on_play:
      then:
        - fan.turn_on:
            id: mtr_tape
            direction: FORWARD
            speed: 100
    on_pause:
      then:
        - fan.turn_off:
            id: mtr_tape
    on_idle:
      then:
        - fan.turn_off:
            id: mtr_tape     
  - platform: sendspin
    name: "SendSpin Group"
