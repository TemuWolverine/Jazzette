substitutions:
  media_sample_rate: 48000
  
  friendly_name: Jazzette
  device_name: jazzette

  clk_pin: GPIO03
  mosi_pin: GPIO04
  dc_pin: GPIO02
  cs_pin: GPIO01
  rst_pin: GPIO05

  btna_pin: GPIO07
  btnb_pin: GPIO08
  btnc_pin: GPIO09
  btnd_pin: GPIO10

  mtr_a: GPIO41
  mtr_b: GPIO42
  mtr_slp: GPIO45

  nfc_sda: GPIO17
  nfc_scl: GPIO18

  headphone_ws: GPIO48
  headphone_bck: GPIO47
  headphone_din: GPIO38

  coax_din: GPIO21
  toslink_din: GPIO40
  
  threewayswitcha: GPIO13
  threewayswitchb: GPIO14

packages:
  esphome_templates:
    url: https://github.com/TemuWolverine/esphome_templates
    ref: main
    refresh: 1d
    files:
      - esphome_boilerplate.yaml
      - boards/esp32_s3_nano.yaml
        
esphome:
  name_add_mac_suffix: false
  on_boot:
    priority: -100
    then:
      - script.execute: update_selector

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  services:
    - service: write_nfc_uri
      variables:
        uri: string
      then:
        - text.set:
            id: nfc_tag_write_text
            value: !lambda 'return uri;'

# Allow Over-The-Air updates
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  manual_ip:
    static_ip: 10.0.1.138
    gateway: 10.0.0.1
    subnet: 255.0.0.0

globals:
  - id: selector_state
    type: int
    restore_value: no
    initial_value: '-1'
  - id: headphone_volume
    type: float
    restore_value: yes
    initial_value: '0.5'
  - id: coax_volume
    type: float
    restore_value: yes
    initial_value: '1.0'
  - id: toslink_volume
    type: float
    restore_value: yes
    initial_value: '1.0'
  - id: is_switching_output
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: tag_is_present
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: detected_tag_uri
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: detected_tag_uid
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: current_playing_item
    type: std::string
    restore_value: no
    initial_value: '""'
  
font:
  - file: "gfonts://Roboto"
    id: myfont
    size: 20
  - file: "gfonts://Roboto"
    id: font_title
    size: 14
  - file: "gfonts://Roboto"
    id: font_small
    size: 9

image:
  - platform: file
    file: images/headphones.bmp
    id: icon_headphones
    type: BINARY
  - platform: file
    file: images/toslink.bmp
    id: icon_toslink
    type: BINARY
  - platform: file
    file: images/coax.bmp
    id: icon_coax
    type: BINARY

spi:
  clk_pin: ${clk_pin}
  mosi_pin: ${mosi_pin}
  
display:
  - platform: ssd1322_spi
    model: "SSD1322 256x64"
    reset_pin: ${rst_pin}
    cs_pin: ${cs_pin}
    dc_pin: ${dc_pin}
    lambda: |-
      // Audio output status icon (top-right: x=240, y=0)
      if (id(selector_state) == 2) {
        it.image(240, 0, id(icon_headphones));
      } else if (id(selector_state) == 1) {
        it.image(240, 0, id(icon_coax));
      } else if (id(selector_state) == 0) {
        it.image(240, 0, id(icon_toslink));
      }

      if (id(nfc_write_mode).state) {
        it.print(128, 14, id(font_title), TextAlign::TOP_CENTER, "WRITE MODE");
        it.print(128, 36, id(font_small), TextAlign::TOP_CENTER, "Use Home Assistant to set tag URI");
        it.print(128, 49, id(font_small), TextAlign::TOP_CENTER, "or hold A for 5 seconds to cancel");
        return;
      }

      std::string title  = id(track_title).has_state() && !id(track_title).state.empty() ? id(track_title).state : "Nothing Playing";
      std::string artist = id(track_artist).has_state() ? id(track_artist).state : "";
      std::string album  = id(track_album).has_state() ? id(track_album).state : "";

      int elapsed = 0;
      if (id(track_progress).has_state() && !std::isnan(id(track_progress).state)) {
        elapsed = (int)(id(track_progress).state > 1000 ? id(track_progress).state / 1000.0f : id(track_progress).state);
      }

      int duration = 0;
      if (id(track_duration).has_state() && !std::isnan(id(track_duration).state)) {
        duration = (int)(id(track_duration).state > 1000 ? id(track_duration).state / 1000.0f : id(track_duration).state);
      }

      // Track title
      it.print(0, 0, id(font_title), title.c_str());

      // Audio output status icon (draw after title to keep top-right clean)
      if (id(selector_state) == 2) {
        it.image(240, 0, id(icon_headphones));
      } else if (id(selector_state) == 1) {
        it.image(240, 0, id(icon_coax));
      } else if (id(selector_state) == 0) {
        it.image(240, 0, id(icon_toslink));
      }

      // Artist
      it.print(0, 17, id(font_small), artist.c_str());

      // Album
      if (!album.empty()) {
        it.print(0, 29, id(font_small), album.c_str());
      }

      // Progress bar
      const int bar_x = 0;
      const int bar_y = 44;
      const int bar_w = 256;
      const int bar_h = 5;

      it.rectangle(bar_x, bar_y, bar_w, bar_h);

      float progress = 0.0f;
      if (duration > 0) {
        progress = (float) elapsed / (float) duration;
        if (progress > 1.0f) progress = 1.0f;
        if (progress < 0.0f) progress = 0.0f;
      }

      int progress_w = (int)((bar_w - 2) * progress);

      it.filled_rectangle(
        bar_x + 1,
        bar_y + 1,
        progress_w,
        bar_h - 2
      );

      // Convert times to mm:ss
      int elapsed_min = elapsed / 60;
      int elapsed_sec = elapsed % 60;

      int duration_min = duration / 60;
      int duration_sec = duration % 60;

      char elapsed_text[8];
      char duration_text[8];

      snprintf(
        elapsed_text,
        sizeof(elapsed_text),
        "%d:%02d",
        elapsed_min,
        elapsed_sec
      );

      snprintf(
        duration_text,
        sizeof(duration_text),
        "%d:%02d",
        duration_min,
        duration_sec
      );

      // Time
      it.print(
        0,
        52,
        id(font_small),
        elapsed_text
      );

      // Volume level (horizontally centered at the bottom)
      float vol = id(sendspin_media_player).volume;
      int vol_pct = 0;
      if (!std::isnan(vol)) {
        vol_pct = (int) std::round(vol * 100.0f);
        if (vol_pct < 0) vol_pct = 0;
        if (vol_pct > 100) vol_pct = 100;
      }
      if (id(sendspin_media_player).is_muted()) {
        it.print(128, 52, id(font_small), TextAlign::TOP_CENTER, "MUTE");
      } else {
        it.printf(128, 52, id(font_small), TextAlign::TOP_CENTER, "%d%%", vol_pct);
      }

      it.print(
        256,
        52,
        id(font_small),
        TextAlign::TOP_RIGHT,
        duration_text
      );

output:
  - platform: ledc
    id: motor_enable
    pin: ${mtr_slp}
    
  - platform: ledc
    id: motor_forward_pin
    pin: ${mtr_a}
    
  - platform: ledc
    id: motor_reverse_pin
    pin: ${mtr_b}
 
fan:
  - platform: hbridge
    id: mtr_tape
    name: "Tape Motor"
    pin_a: motor_forward_pin 
    pin_b: motor_reverse_pin
    enable_pin: motor_enable
    decay_mode: slow

i2c:
  sda: ${nfc_sda}
  scl: ${nfc_scl}
  scan: true
  frequency: 100kHz

pn532_i2c:
  id: pn532_board
  update_interval: 1s
  on_tag:
    then:
      - lambda: |-
          if (id(nfc_write_mode).state) {
            ESP_LOGI("nfc", "NFC Write Mode active, skipping playback trigger");
            return;
          }

          id(tag_is_present) = true;
          id(detected_tag_uid) = x;
          std::string uri = "";
          if (tag.has_ndef_message()) {
            auto message = tag.get_ndef_message();
            for (auto &record : message->get_records()) {
              std::string payload = record->get_payload();
              size_t pos = payload.find("library://");
              if (pos == std::string::npos) pos = payload.find("spotify://");
              if (pos == std::string::npos) pos = payload.find("filesystem://");
              if (pos != std::string::npos) {
                uri = payload.substr(pos);
                break;
              }
            }
          }

          id(detected_tag_uri) = uri;
          if (!uri.empty()) {
            ESP_LOGI("nfc", "Tag detected with URI: %s", uri.c_str());
            id(rfid_tag).publish_state(uri);
            if (id(current_playing_item) != uri) {
              id(current_playing_item) = uri;
              ESP_LOGI("nfc", "New tag with valid URI -> immediately queueing album in paused state: %s", uri.c_str());
              id(trigger_nfc_play).execute(x, uri);
            }
          } else {
            ESP_LOGI("nfc", "Tag detected with UID: %s", x.c_str());
            id(rfid_tag).publish_state(x);
          }
  on_tag_removed:
    then:
      - lambda: |-
          id(tag_is_present) = false;
          id(detected_tag_uri) = "";
          id(detected_tag_uid) = "";
          id(current_playing_item) = "";
          id(rfid_tag).publish_state("None");
          ESP_LOGI("nfc", "Tag removed from reader");

          if (!id(nfc_write_mode).state) {
            ESP_LOGI("nfc", "Tag removed -> pausing playback");
            auto call = id(sendspin_media_player).make_call();
            call.set_command(media_player::MEDIA_PLAYER_COMMAND_PAUSE);
            call.perform();
          }
      - if:
          condition:
            lambda: 'return !id(nfc_write_mode).state;'
          then:
            - homeassistant.event:
                event: esphome.rfid_tag_removed

binary_sensor:
  - platform: pn532
    pn532_id: pn532_board
    uid: 74-10-37-94
    name: "PN532 NFC Tag"

  - platform: gpio
    id: button_a
    name: "Button A"
    pin:
      number: ${btna_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      then:
        - if:
            condition:
              lambda: 'return id(nfc_write_mode).state;'
            then:
              - script.execute: check_a_cancel_hold
            else:
              - script.execute: check_ab_hold
    on_release:
      then:
        - script.stop: check_a_cancel_hold
        - script.stop: check_ab_hold
    on_multi_click:
      - timing:
          - ON for at most 350ms
          - OFF for at least 250ms
        then:
          - if:
              condition:
                lambda: 'return !id(nfc_write_mode).state;'
              then:
                - lambda: |-
                    ESP_LOGI("button_a", "Single click: Toggling play/pause");
                    auto call = id(sendspin_media_player).make_call();
                    call.set_command(media_player::MEDIA_PLAYER_COMMAND_TOGGLE);
                    call.perform();
                - homeassistant.event:
                    event: esphome.button_click
                    data:
                      button: a
      - timing:
          - ON for at most 350ms
          - OFF for at most 350ms
          - ON for at most 350ms
        then:
          - if:
              condition:
                lambda: 'return !id(nfc_write_mode).state;'
              then:
                - lambda: |-
                    ESP_LOGI("button_a", "Double click: Next track");
                    auto call = id(sendspin_media_player).make_call();
                    call.set_command(media_player::MEDIA_PLAYER_COMMAND_NEXT);
                    call.perform();
                - homeassistant.event:
                    event: esphome.button_click
                    data:
                      button: a
                      action: double_click

  - platform: gpio
    id: button_b
    name: "Button B"
    pin:
      number: ${btnb_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      then:
        - script.execute: check_ab_hold
    on_release:
      then:
        - script.stop: check_ab_hold
    on_click:
      then:
        - if:
            condition:
              lambda: 'return !id(nfc_write_mode).state;'
            then:
              - lambda: |-
                  ESP_LOGI("button_b", "Previous track");
                  auto call = id(sendspin_media_player).make_call();
                  call.set_command(media_player::MEDIA_PLAYER_COMMAND_PREVIOUS);
                  call.perform();
              - homeassistant.event:
                  event: esphome.button_click
                  data:
                    button: b

  - platform: gpio
    id: button_c
    name: "Button C"
    pin:
      number: ${btnc_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_click:
      then:
        - lambda: |-
            ESP_LOGI("button_c", "Volume Up");
            auto call = id(sendspin_media_player).make_call();
            call.set_command(media_player::MEDIA_PLAYER_COMMAND_VOLUME_UP);
            call.perform();
        - homeassistant.event:
            event: esphome.button_click
            data:
              button: c

  - platform: gpio
    id: button_d
    name: "Button D"
    pin:
      number: ${btnd_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_click:
      then:
        - lambda: |-
            ESP_LOGI("button_d", "Volume Down");
            auto call = id(sendspin_media_player).make_call();
            call.set_command(media_player::MEDIA_PLAYER_COMMAND_VOLUME_DOWN);
            call.perform();
        - homeassistant.event:
            event: esphome.button_click
            data:
              button: d

  - platform: gpio
    id: selector_a
    pin:
      number: ${threewayswitcha}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_state:
      then:
        - script.execute: update_selector

  - platform: gpio
    id: selector_b
    pin:
      number: ${threewayswitchb}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_state:
      then:
        - script.execute: update_selector

# NFC Tag Writing Entities for Home Assistant
switch:
  - platform: template
    name: "NFC Write Mode"
    id: nfc_write_mode
    icon: "mdi:nfc-tap"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: |-
          ESP_LOGI("nfc", "NFC Write Mode enabled");
      - script.execute: arm_nfc_write
      - homeassistant.event:
          event: esphome.nfc_write_mode_changed
          data:
            state: "on"
    turn_off_action:
      - lambda: |-
          ESP_LOGI("nfc", "NFC Write Mode disabled");
          id(pn532_board).read_mode();
      - script.stop: arm_nfc_write
      - homeassistant.event:
          event: esphome.nfc_write_mode_changed
          data:
            state: "off"

text:
  - platform: template
    name: "NFC Tag Write Text"
    id: nfc_tag_write_text
    icon: "mdi:nfc-variant"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "library://album/"
    set_action:
      - lambda: |-
          ESP_LOGI("nfc", "Stored new tag write text: %s", x.c_str());
          // If Write Mode is currently active, update the primed write message
          if (id(nfc_write_mode).state && !x.empty()) {
            id(arm_nfc_write).execute();
          }

# Home Assistant output dropdown selector
select:
  - platform: template
    name: "Audio Output"
    id: audio_output_selector
    icon: "mdi:volume-source"
    options:
      - "TOSLINK SPDIF"
      - "Coaxial SPDIF"
      - "Headphones"
    initial_option: "Headphones"
    optimistic: true
    set_action:
      - if:
          condition:
            lambda: 'return !id(is_switching_output);'
          then:
            - script.execute:
                id: switch_audio_output
                mode: !lambda |-
                  if (x == "TOSLINK SPDIF") return 0;
                  if (x == "Coaxial SPDIF") return 1;
                  return 2;

# Sendspin audio hub
sendspin:

# I2S Audio buses (ESP32-S3 supports 2 hardware I2S controllers)
i2s_audio:
  - id: i2s_headphone
    i2s_lrclk_pin: ${headphone_ws}
    i2s_bclk_pin: ${headphone_bck}

  - id: i2s_spdif

# Speaker outputs
speaker:
  - platform: i2s_audio
    id: speaker_headphone
    dac_type: external
    i2s_audio_id: i2s_headphone
    i2s_dout_pin: ${headphone_din}
    sample_rate: ${media_sample_rate}
    channel: stereo
    timeout: never

  - platform: i2s_audio
    id: speaker_spdif
    dac_type: external
    i2s_audio_id: i2s_spdif
    i2s_dout_pin: ${coax_din}
    spdif_mode: true
    sample_rate: ${media_sample_rate}
    channel: stereo
    use_apll: true
    i2s_mode: primary
    i2s_comm_fmt: stand_i2s
    mclk_multiple: 256

  # Router to switch between SPDIF and Headphones
  - platform: router
    id: audio_router
    output_speakers:
      - speaker_headphone
      - speaker_spdif
    sample_rate: ${media_sample_rate}
    num_channels: 2
    bits_per_sample: 16

# Media source from SendSpin
media_source:
  - platform: sendspin
    id: sendspin_source

# Media players
media_player:
  - platform: speaker_source
    id: sendspin_media_player
    name: "SendSpin Media Player"
    media_pipeline:
      format: FLAC
      sample_rate: ${media_sample_rate}
      num_channels: 2
      speaker: audio_router
      sources:
        - sendspin_source
    on_state:
      then:
        - lambda: |-
            if (!id(is_switching_output)) {
              float vol = id(sendspin_media_player).volume;
              if (!std::isnan(vol) && vol > 0.01f) {
                if (id(selector_state) == 2) {
                  id(headphone_volume) = vol;
                  ESP_LOGD("volume", "Saved headphone volume: %.2f", vol);
                } else if (id(selector_state) == 1) {
                  id(coax_volume) = vol;
                  ESP_LOGD("volume", "Saved coax volume: %.2f", vol);
                } else if (id(selector_state) == 0) {
                  id(toslink_volume) = vol;
                  ESP_LOGD("volume", "Saved toslink volume: %.2f", vol);
                }
              }
            }

  - platform: sendspin
    name: "SendSpin Group"

# SendSpin metadata sensors for display
sensor:
  - platform: sendspin
    id: track_progress
    type: track_progress

  - platform: sendspin
    id: track_duration
    type: track_duration

text_sensor:
  - platform: template
    name: "RFID Tag"
    id: rfid_tag

  - platform: template
    name: "Selector Position"
    id: selector_position

  - platform: sendspin
    id: track_title
    type: title

  - platform: sendspin
    id: track_artist
    type: artist

  - platform: sendspin
    id: track_album
    type: album

script:
  - id: check_a_cancel_hold
    mode: restart
    then:
      - delay: 5s
      - if:
          condition:
            lambda: 'return id(button_a).state && id(nfc_write_mode).state;'
          then:
            - logger.log: "Button A held for 5 seconds -> Cancelling NFC Write Mode"
            - switch.turn_off: nfc_write_mode

  - id: check_ab_hold
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(button_a).state && id(button_b).state;'
          then:
            - delay: 5s
            - if:
                condition:
                  lambda: 'return id(button_a).state && id(button_b).state;'
                then:
                  - logger.log: "Buttons A & B held for 5 seconds -> Activating NFC Write Mode!"
                  - switch.turn_on: nfc_write_mode

  - id: arm_nfc_write
    mode: restart
    then:
      - lambda: |-
          std::string text_to_write = id(nfc_tag_write_text).state;
          if (text_to_write.empty()) {
            ESP_LOGW("nfc", "Write mode enabled, but NFC write text is empty! Enter URI in Home Assistant.");
            return;
          }
          auto message = new nfc::NdefMessage();
          message->add_uri_record(text_to_write);
          id(pn532_board).write_mode(message);
          ESP_LOGI("nfc", "PN532 primed to write URI: %s. Tap an NFC tag now!", text_to_write.c_str());
      - delay: 100ms
      - wait_until:
          not: pn532.is_writing
      - lambda: |-
          ESP_LOGI("nfc", "NFC tag write complete!");
      - switch.turn_off: nfc_write_mode
      - homeassistant.event:
          event: esphome.nfc_tag_written
          data:
            uri: !lambda 'return id(nfc_tag_write_text).state;'

  - id: trigger_nfc_play
    parameters:
      tag_id: string
      uri: string
    mode: restart
    then:
      - homeassistant.event:
          event: esphome.rfid_tag_scanned
          data:
            tag_id: !lambda 'return tag_id;'
            uri: !lambda 'return uri;'

  - id: switch_audio_output
    parameters:
      mode: int
    mode: restart
    then:
      - lambda: |-
          #include <driver/gpio.h>
          #include <esp_rom_gpio.h>
          #include <soc/gpio_sig_map.h>

          id(is_switching_output) = true;
          id(selector_state) = mode;

          // 1. Configure S/PDIF GPIO matrix multiplexing
          auto configure_pin = [](gpio_num_t pin, bool enable) {
            gpio_set_direction(pin, GPIO_MODE_OUTPUT);
            if (enable) {
              esp_rom_gpio_connect_out_signal(pin, I2S1O_SD_OUT_IDX, false, false);
            } else {
              esp_rom_gpio_connect_out_signal(pin, SIG_GPIO_OUT_IDX, false, false);
              gpio_set_level(pin, 0);
            }
          };
          configure_pin(GPIO_NUM_40, mode == 0); // TOSLINK (GPIO40)
          configure_pin(GPIO_NUM_21, mode == 1); // Coaxial (GPIO21)

          // 2. Switch Router Speaker output
          if (mode == 2) {
            id(audio_router).switch_to_output(id(speaker_headphone));
          } else {
            id(audio_router).switch_to_output(id(speaker_spdif));
          }

          // 3. Set independent volume per output mode
          float target_vol = 1.0f;
          const char* names[] = {"TOSLINK SPDIF", "Coaxial SPDIF", "Headphones"};

          if (mode == 2) {
            target_vol = id(headphone_volume);
            if (std::isnan(target_vol) || target_vol <= 0.01f) {
              target_vol = 0.5f;
              id(headphone_volume) = 0.5f;
            }
          } else if (mode == 1) {
            target_vol = id(coax_volume);
            if (std::isnan(target_vol) || target_vol <= 0.01f) {
              target_vol = 1.0f;
              id(coax_volume) = 1.0f;
            }
          } else if (mode == 0) {
            target_vol = id(toslink_volume);
            if (std::isnan(target_vol) || target_vol <= 0.01f) {
              target_vol = 1.0f;
              id(toslink_volume) = 1.0f;
            }
          }

          if (mode >= 0 && mode <= 2) {
            ESP_LOGI("switch_audio", "%s selected, setting volume: %.2f", names[mode], target_vol);
            id(audio_output_selector).publish_state(names[mode]);
            id(selector_position).publish_state(names[mode]);
          } else {
            id(selector_position).publish_state("Invalid");
          }

          auto call = id(sendspin_media_player).make_call();
          call.set_volume(target_vol);
          call.perform();
      - delay: 100ms
      - lambda: |-
          id(is_switching_output) = false;

  - id: update_selector
    mode: restart
    then:
      - delay: 10ms
      - lambda: |-
          bool a = id(selector_a).state;
          bool b = id(selector_b).state;

          int mode = -1;
          if (a && !b) {
            mode = 0;
          } else if (!a && !b) {
            mode = 1;
          } else if (!a && b) {
            mode = 2;
          }

          if (mode != -1) {
            id(switch_audio_output).execute(mode);
          }